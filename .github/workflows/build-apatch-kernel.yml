name: Build APatch Kernel (Pixel 4)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "🛠 Cài đặt môi trường build"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git python3 zip unzip rsync
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "📥 Clone AnyKernel3"
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master
          cd AnyKernel3
          # Cấu hình AnyKernel3 cho Pixel 4 (Coral)
          sed -i 's/device.name1=maguro/device.name1=coral\ndevice.name2=flame/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh

      - name: "🔄 Repo Init & Sync mã nguồn Kernel Pixel 4"
        run: |
          mkdir -p android-kernel
          cd android-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          repo init -u https://android.googlesource.com/kernel/manifest -b android-msm-coral-4.14-android13 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          # Bỏ qua kiểm tra savedefconfig khắt khe của Google
          echo "Bypassing savedefconfig check in all build scripts..."
          find . -type f -name "*.sh" -exec grep -l "savedefconfig does not match" {} + | while read file; do
            echo "Patching $file..."
            sed -i 's/echo "ERROR: savedefconfig does not match/return 0; #/g' "$file"
            sed -i 's/echo ERROR: savedefconfig does not match/return 0; #/g' "$file"
            sed -i '/savedefconfig does not match/d' "$file"
          done

      - name: "🔧 Cấu hình Kernel cho APatch"
        run: |
          cd $GITHUB_WORKSPACE/android-kernel/private/msm-google
          
          # APatch yêu cầu KALLSYMS và KALLSYMS_ALL
          echo "Configuring KALLSYMS for APatch..."
          for defconf in coral_defconfig floral_defconfig; do
            if [ -f "arch/arm64/configs/$defconf" ]; then
              DEFCONFIG="arch/arm64/configs/$defconf"
              echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
              echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
            fi
          done

          # Cấu hình thêm build
          echo "ARCH=arm64" >> build.config.common
          echo "CC=clang" >> build.config.common
          echo "LLVM=1" >> build.config.common
          echo "LLVM_IAS=1" >> build.config.common
          
      - name: "🚀 Build Kernel"
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          export SKIP_DEFCONFIG_CHECK=1
          export LTO=none
          ./build_floral.sh || { echo "❌ BUILD KERNEL BỊ CRASH RỒI CU!"; exit 1; }

      - name: "📦 Đóng gói AnyKernel3 ZIP"
        run: |
          cd $GITHUB_WORKSPACE
          cp android-kernel/out/android-msm-pixel-4.14/private/msm-google/arch/arm64/boot/Image.lz4 AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Pixel4-APatch-Kernel.zip * -x .git README.md *placeholder

      - name: "⬆️ Upload Kernel"
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-APatch-Kernel
          path: Pixel4-APatch-Kernel.zip
