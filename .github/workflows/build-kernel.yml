name: Build Pixel 4 KernelSU Next

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: "💽 Dọn dẹp ổ đĩa GitHub Runner (~30GB)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker image prune -a -f || true

      - name: "📦 Cài đặt công cụ và phụ thuộc"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "🔄 Repo Init & Sync mã nguồn Kernel Pixel 4"
        run: |
          mkdir -p android-kernel
          cd android-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          repo init -u https://android.googlesource.com/kernel/manifest -b android-msm-coral-4.14-android13 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          # Bỏ qua kiểm tra savedefconfig khắt khe của Google
          echo "Bypassing savedefconfig check in all build scripts..."
          find . -type f -name "*.sh" -exec grep -l "savedefconfig does not match" {} + | while read file; do
            echo "Patching $file..."
            sed -i 's/echo ERROR: savedefconfig does not match/echo WARNING: savedefconfig does not match/g' "$file"
            sed -i 's/echo "ERROR: savedefconfig does not match/echo "WARNING: savedefconfig does not match/g' "$file"
            sed -i '/savedefconfig does not match/{n;s/return 1/return 0/}' "$file"
          done

      - name: "🔧 Tích hợp KernelSU Next & SUSFS (Manual Hook)"
        run: |
          cd $GITHUB_WORKSPACE/android-kernel/private/msm-google

          # 1. Kéo KernelSU-Next nhánh có sẵn SUSFS
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.1.0-legacy-susfs/kernel/setup.sh" | bash -s v3.1.0-legacy-susfs

          # 2. Disable KPROBES & Enable Manual Hook for all possible defconfigs
          echo "Disabling KPROBES and applying manual hooks..."
          for defconf in coral_defconfig floral_defconfig; do
            if [ -f "arch/arm64/configs/$defconf" ]; then
              scripts/config --file arch/arm64/configs/$defconf -d KPROBES -d KPROBE_EVENTS
              scripts/config --file arch/arm64/configs/$defconf -e KSU_MANUAL_HOOK
            fi
          done

          # 3. Chạy Coccinelle để tự động chèn hook
          echo "Installing Coccinelle and applying manual hooks..."
          sudo apt-get update && sudo apt-get install -y coccinelle
          git clone https://github.com/devnoname120/kernelsu-coccinelle.git $GITHUB_WORKSPACE/ksu-cocci
          cd $GITHUB_WORKSPACE/ksu-cocci/classic-hooks
          bash apply.sh $GITHUB_WORKSPACE/android-kernel/private/msm-google
          cd $GITHUB_WORKSPACE/android-kernel/private/msm-google

          # 4. Sửa lỗi Forward Declaration trong namespace.c cho KSU Manual Hook (tránh compiler error)
          perl -pi -e 's/#include "internal.h"/#include "internal.h"\nstatic inline int check_mnt(struct mount *mnt);\nstatic int do_umount(struct mount *mnt, int flags);\nstatic void mntput_no_expire(struct mount *mnt);\nstatic inline bool may_mount(void);\n/g' fs/namespace.c
          perl -pi -e 's/mutex_lock\(&reboot_mutex\);/#ifdef CONFIG_KSU\nextern void ksu_handle_sys_reboot(void);\nksu_handle_sys_reboot();\n#endif\n\tmutex_lock(&reboot_mutex);/g' kernel/reboot.c
          
          # Đảm bảo Kbuild của KernelSU-Next không báo lỗi vô lý bằng cách vô hiệu hoá hàm kiểm tra
          echo "Patching Kbuild to bypass hook check error..."
          sed -i 's/\$(error -- KernelSU-Next: No hooks were defined.*)//g' drivers/kernelsu/Kbuild

          # 5. Tích hợp SUSFS Kernel Patches
          echo "Integrating SUSFS Kernel Patches..."
          git clone --depth=1 --branch kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

          # 6. Ghi config vào defconfig
          for defconf in coral_defconfig floral_defconfig; do
            if [ -f "arch/arm64/configs/$defconf" ]; then
              DEFCONFIG="arch/arm64/configs/$defconf"
              echo "CONFIG_KSU=y" >> $DEFCONFIG
              echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
              
              # SUSFS Configs
              echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG
            fi
          done

          # Append thẳng vào build.config.common cho chắc cú
          echo "ARCH=arm64" >> build.config.common
          echo "WRITE_CONFIG_KSU=y" >> build.config.common

      - name: "🏗️ Build Kernel (In Log Chi Tiết)"
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          
          # Tắt LTO để tránh văng RAM / OOM Compiler crash
          export LTO=none
          export SKIP_DEFCONFIG_CHECK=1
          ./build_floral.sh || { echo "❌ BUILD KERNEL BỊ CRASH RỒI CU!"; exit 1; }

      - name: "📦 Đóng gói AnyKernel3 ZIP"
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          DIST_OUT="$GITHUB_WORKSPACE/android-kernel/out/android-msm-pixel-4.14/dist"

          if [ ! -d "$DIST_OUT" ]; then
            echo "❌ Build thối rồi, éo thấy thư mục dist đâu!"
            exit 1
          fi

          # Ưu tiên nhặt Image
          if [ -f "$DIST_OUT/Image.lz4-dtb" ]; then
            cp "$DIST_OUT/Image.lz4-dtb" AnyKernel3/Image.lz4-dtb
          elif [ -f "$DIST_OUT/Image.gz-dtb" ]; then
            cp "$DIST_OUT/Image.gz-dtb" AnyKernel3/Image.gz-dtb
          elif [ -f "$DIST_OUT/Image" ]; then
            cp "$DIST_OUT/Image" AnyKernel3/Image
          fi

          [ -f "$DIST_OUT/dtbo.img" ] && cp "$DIST_OUT/dtbo.img" AnyKernel3/

          cd AnyKernel3
          sed -i 's/^kernel\.string=.*/kernel.string=Pixel 4 KernelSU Next/' anykernel.sh
          sed -i 's/^device\.name1=.*/device.name1=coral/' anykernel.sh
          sed -i 's/^device\.name2=.*/device.name2=flame/' anykernel.sh

          zip -r9 ../Pixel4-KernelSU-Next.zip * -x ".git/*" -x "README.md"

      - name: "⬆️ Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-KernelSU-Next
          path: Pixel4-KernelSU-Next.zip
          retention-days: 7
