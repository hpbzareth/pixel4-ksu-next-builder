name: Build Pixel 4 KernelSU Next

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: BUILD KERNEL
  # Nếu job này pass → không cần chạy lại dù job 2 fail
  # ============================================================
  build:
    name: "🏗️ Build Kernel"
    runs-on: ubuntu-22.04

    steps:
      - name: "💽 Dọn dẹp ổ đĩa"
        run: |
          echo "=== Dung lượng BAN ĐẦU ===" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/share/swift /usr/lib/jvm
          sudo docker image prune -a -f || true
          echo "=== Dung lượng SAU DỌN ===" && df -h /

      - name: "📦 Cài đặt phụ thuộc"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "🔄 Repo Sync"
        run: |
          mkdir android-kernel && cd android-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-msm-coral-4.14-android13 \
            --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          echo "=== Dung lượng sau sync ===" && df -h /

      - name: "🔧 Tích hợp KernelSU Next"
        run: |
          cd android-kernel/private/msm-google
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          DEFCONFIG="arch/arm64/configs/floral_defconfig"
          echo "CONFIG_KSU=y"             >> $DEFCONFIG
          echo "CONFIG_KPROBES=y"         >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y"    >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y"   >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y"      >> $DEFCONFIG
          echo "=== Config KSU đã thêm ===" && tail -6 $DEFCONFIG
          echo "=== Config KSU đã thêm ===" && tail -6 $DEFCONFIG

      - name: "⚙️ Build Kernel"
        run: |
          cd android-kernel
          LTO=thin ./build_floral.sh
          echo "=== Dung lượng sau build ===" && df -h /

      - name: "🔍 Kiểm tra output dist/"
        run: |
          DIST_OUT="android-kernel/out/android-msm-pixel-4.14/dist"
          echo "=== Toàn bộ files trong dist/ ==="
          ls -lh $DIST_OUT

      # Upload dist/ để job 2 dùng, cũng dùng để debug nếu cần
      - name: "⬆️ Upload dist/ artifact"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: android-kernel/out/android-msm-pixel-4.14/dist/
          retention-days: 1

  # ============================================================
  # JOB 2: ĐÓNG GÓI ANYKERNEL3
  # Chỉ phụ thuộc vào artifact của job 1
  # Fail → Re-run job này thôi, KHÔNG build lại kernel
  # ============================================================
  package:
    name: "📦 Đóng gói AnyKernel3"
    runs-on: ubuntu-22.04
    needs: build  # Chờ job build xong mới chạy

    steps:
      - name: "⬇️ Download dist/ artifact"
        uses: actions/download-artifact@v4
        with:
          name: kernel-dist
          path: dist/

      - name: "🔍 Kiểm tra files nhận được"
        run: |
          echo "=== Files trong dist/ ==="
          ls -lh dist/

      - name: "📁 Clone AnyKernel3"
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3

      - name: "🗜️ Copy kernel vào AnyKernel3"
        run: |
          # Dùng find wildcard, không đoán tên file nữa
          find dist/ -maxdepth 1 -name "Image*" -exec cp -v {} AnyKernel3/ \;

          # Copy dtbo.img nếu có
          [ -f dist/dtbo.img ] && cp -v dist/dtbo.img AnyKernel3/

          echo "=== Files trong AnyKernel3/ sau copy ==="
          ls -lh AnyKernel3/

          # Fail rõ ràng nếu không có kernel image
          ls AnyKernel3/Image* 2>/dev/null || { echo "❌ Không tìm thấy kernel image!"; exit 1; }

      - name: "✏️ Cấu hình anykernel.sh cho Pixel 4"
        run: |
          cd AnyKernel3
          # Device info
          sed -i 's/^kernel\.string=.*/kernel.string=Pixel 4 \/ 4XL KernelSU Next/' anykernel.sh
          sed -i 's/^device\.name1=.*/device.name1=coral/' anykernel.sh
          sed -i 's/^device\.name2=.*/device.name2=flame/' anykernel.sh
          # Fix block device path (default là OMAP, sai với Pixel 4 Qualcomm)
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/|' anykernel.sh
          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh

          echo "=== anykernel.sh sau khi sửa ==="
          head -20 anykernel.sh

      - name: "🗜️ Tạo ZIP"
        run: |
          cd AnyKernel3
          zip -r9 ../Pixel4-KernelSU-Next.zip * -x ".git/*" -x "README.md"
          echo "=== ZIP đã tạo ==="
          ls -lh ../Pixel4-KernelSU-Next.zip

      - name: "⬆️ Upload Artifact ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-KernelSU-Next
          path: Pixel4-KernelSU-Next.zip
          retention-days: 7
