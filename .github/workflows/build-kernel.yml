name: Build Pixel 4 KernelSU Next

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: "💽 Dọn dẹp ổ đĩa GitHub Runner (~30GB)"
        run: |
          echo "=== Dung lượng BAN ĐẦU ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune -a -f || true
          echo "=== Dung lượng SAU KHI DỌN ==="
          df -h /

      - name: "📦 Cài đặt công cụ và phụ thuộc"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "🔄 Repo Init & Sync mã nguồn Kernel Pixel 4"
        run: |
          mkdir android-kernel && cd android-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-msm-coral-4.14-android13 \
            --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          echo "=== Dung lượng sau repo sync ==="
          df -h /

      - name: "🔧 Tích hợp KernelSU Next"
        run: |
          cd android-kernel/private/msm-google

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # floral_defconfig mới là tên đúng (coral/flame dùng chung)
          DEFCONFIG="arch/arm64/configs/floral_defconfig"
          echo "CONFIG_KSU=y"           >> $DEFCONFIG
          echo "CONFIG_KPROBES=y"       >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y"  >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y"    >> $DEFCONFIG
          echo "=== Config đã thêm ===" && tail -6 $DEFCONFIG

          # Xóa check_defconfig để build không bị fail khi so sánh defconfig
          sed -i '/POST_DEFCONFIG_CMDS/d' build.config.no-cfi

      - name: "🏗️ Build Kernel"
        run: |
          cd android-kernel
          LTO=thin ./build_floral.sh
          echo "=== Dung lượng sau build ==="
          df -h /

      - name: "📁 Kiểm tra Kernel Output"
        run: |
          DIST_OUT="android-kernel/out/android-msm-pixel-4.14/dist"
          echo "=== Files trong dist/ ==="
          ls -lh $DIST_OUT || echo "Không tìm thấy thư mục dist!"

      - name: "📦 Đóng gói AnyKernel3 ZIP"
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          DIST_OUT="android-kernel/out/android-msm-pixel-4.14/dist"

          # Dùng wildcard, không đoán tên file nữa
          find $DIST_OUT -maxdepth 1 -name "Image*" -exec cp -v {} AnyKernel3/ \;
          [ -f "$DIST_OUT/dtbo.img" ] && cp -v "$DIST_OUT/dtbo.img" AnyKernel3/

          # Fail rõ ràng nếu không có kernel image
          ls AnyKernel3/Image* || { echo "❌ Không có kernel image!"; exit 1; }

          cd AnyKernel3
          sed -i 's/^kernel\.string=.*/kernel.string=Pixel 4 KernelSU Next/' anykernel.sh
          sed -i 's/^device\.name1=.*/device.name1=flame/' anykernel.sh
          sed -i 's/^device\.name2=.*/device.name2=coral/' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/|' anykernel.sh
          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh

          zip -r9 ../Pixel4-KernelSU-Next.zip * -x ".git/*" -x "README.md"
          echo "=== ZIP tạo thành công ==="
          ls -lh ../Pixel4-KernelSU-Next.zip

      - name: "⬆️ Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-KernelSU-Next
          path: Pixel4-KernelSU-Next.zip
          retention-days: 7
```
