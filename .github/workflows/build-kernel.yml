name: Build Pixel 4 KernelSU Next

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: "💽 Dọn dẹp ổ đĩa GitHub Runner (~30GB)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker image prune -a -f || true

      - name: "📦 Cài đặt công cụ và phụ thuộc"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "🔄 Repo Init & Sync mã nguồn Kernel Pixel 4"
        run: |
          mkdir -p android-kernel
          cd android-kernel
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          repo init -u https://android.googlesource.com/kernel/manifest -b android-msm-coral-4.14-android13 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: "🔧 Tích hợp KernelSU Next (Manual Hook cho Kernel 4.14)"
        run: |
          # Vẫn phải cd chuẩn từ root workspace
          cd $GITHUB_WORKSPACE/android-kernel/private/msm-google

          # Setup KernelSU Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Patch defconfig
          DEFCONFIG="arch/arm64/configs/coral_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

      - name: "🏗️ Build Kernel"
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          # Gọi đúng script build của Google kèm env toolchain
          LTO=thin ./build_floral.sh

      - name: "📦 Đóng gói AnyKernel3 ZIP"
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          DIST_OUT="$GITHUB_WORKSPACE/android-kernel/out/android-msm-pixel-4.14/dist"

          if [ ! -d "$DIST_OUT" ]; then
            echo "❌ Build thối rồi, éo thấy thư mục dist đâu!"
            exit 1
          fi

          # Ưu tiên nhặt Image
          if [ -f "$DIST_OUT/Image.lz4-dtb" ]; then
            cp "$DIST_OUT/Image.lz4-dtb" AnyKernel3/Image.lz4-dtb
          elif [ -f "$DIST_OUT/Image.gz-dtb" ]; then
            cp "$DIST_OUT/Image.gz-dtb" AnyKernel3/Image.gz-dtb
          elif [ -f "$DIST_OUT/Image" ]; then
            cp "$DIST_OUT/Image" AnyKernel3/Image
          fi

          [ -f "$DIST_OUT/dtbo.img" ] && cp "$DIST_OUT/dtbo.img" AnyKernel3/

          cd AnyKernel3
          sed -i 's/^kernel\.string=.*/kernel.string=Pixel 4 KernelSU Next/' anykernel.sh
          sed -i 's/^device\.name1=.*/device.name1=coral/' anykernel.sh
          sed -i 's/^device\.name2=.*/device.name2=flame/' anykernel.sh

          zip -r9 ../Pixel4-KernelSU-Next.zip * -x ".git/*" -x "README.md"

      - name: "⬆️ Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-KernelSU-Next
          path: Pixel4-KernelSU-Next.zip
          retention-days: 7
